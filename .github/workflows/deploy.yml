name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # ランナーにキャッシュ済みの古い24.xではなく、セキュリティ修正を含む最新の24.xを使う
          check-latest: true
          cache: "npm"
      - run: npm ci
      # 公開物に含まれる本番依存に high 以上の既知脆弱性があればデプロイを止める
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
