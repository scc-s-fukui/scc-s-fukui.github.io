version: 2
updates:
  # npm依存の脆弱性修正・更新を週次でPR化する
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint が TypeScript 7 系に未対応のため、メジャー更新は見送る（セキュリティ更新は対象外にならない）
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions のバージョン更新を週次でPR化する
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
